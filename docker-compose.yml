version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - USE_MEMORY_DB=1
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_MODEL=${AI_MODEL:-gpt-4.1-mini}
      # ⚠️ API Key 不在此处配置！
      # 请通过以下方式设置：
      # 1. [推荐] 进入容器后运行 node scripts/setup-credentials.js
      # 2. [不推荐] 设置环境变量 OPENAI_API_KEY（明文风险）
    volumes:
      - campushub-credentials:/root/.campushub
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  campushub-credentials:
